name: Publish generic-app chart to GHCR

on:
  push:
    branches: [main]
    paths:
      - "charts/generic-app/**"
  workflow_dispatch: {}

env:
  CHART_PATH: charts/generic-app
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" --destination dist

      - name: Push chart to GHCR
        run: |
          CHART_TGZ=$(ls dist/*.tgz)
          helm push "$CHART_TGZ" "oci://$CHART_REPO"
