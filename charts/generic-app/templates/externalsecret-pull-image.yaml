apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "generic-app.ecrPullSecretName" . }}
  namespace: {{ include "generic-app.namespace" . }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  annotations:
    # Materialize the pull secret before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.ecrPullSecret.refreshInterval | default "6h" }}
  target:
    name: {{ include "generic-app.ecrPullSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # As expressões abaixo são templates do External Secrets Operator, não do Helm —
        # escapadas com backticks para o Helm emiti-las literalmente.
        .dockerconfigjson: |
          {
            "auths": {
              "{{ `{{ .proxy_endpoint | replace "https://" "" }}` }}": {
                "username": "{{ `{{ .username }}` }}",
                "password": "{{ `{{ .password }}` }}",
                "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
              }
            }
          }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: {{ .Values.ecrPullSecret.generatorRef.apiVersion }}
          kind: {{ .Values.ecrPullSecret.generatorRef.kind }}
          name: {{ .Values.ecrPullSecret.generatorRef.name }}
