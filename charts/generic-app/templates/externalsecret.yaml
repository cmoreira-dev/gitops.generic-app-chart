{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName | default (include "generic-app.fullname" .) }}
  namespace: {{ include "generic-app.namespace" . }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.externalSecrets.secretName | default (include "generic-app.fullname" .) }}
    creationPolicy: Owner
    # ESO's webhook defaults this to Retain; set it explicitly so ArgoCD doesn't
    # see permanent drift on the field.
    deletionPolicy: {{ .Values.externalSecrets.deletionPolicy | default "Retain" }}
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
        # Same reason: pin the ESO-defaulted remoteRef fields.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
