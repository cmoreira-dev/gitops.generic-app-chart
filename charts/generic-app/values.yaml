# Generic chart for cmoreira-dev homelab apps.
# Each consuming app repo (e.g. gitops.<app>) should ship its own values-<app>.yaml
# overriding only what it needs; see examples/values-headlamp.yaml for a full migration example.

# -- Overrides the chart name used to build resource names (defaults to Chart.name).
nameOverride: ""
# -- Overrides the full resource name (defaults to "<release-name>-<name>").
fullnameOverride: ""

# Namespace lifecycle is owned by ArgoCD (Application syncOptions: CreateNamespace=true) —
# this chart no longer renders a Namespace object.
namespace:
  # -- Namespace to deploy into. Defaults to the Helm release namespace when empty.
  name: ""

replicaCount: 1

image:
  # -- Container image repository.
  repository: ""
  # -- Image tag. Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for this app.
  create: true
  # -- Name of the ServiceAccount. Defaults to the fullname when empty.
  name: ""
  annotations: {}

podLabels: {}
podAnnotations: {}

# -- Pod-level securityContext (fsGroup, runAsNonRoot, seccompProfile, etc.).
podSecurityContext: {}

# -- Container-level securityContext (capabilities, readOnlyRootFilesystem, etc.).
securityContext: {}

command: []
args: []

# -- Extra env vars, Kubernetes EnvVar format: [{name, value} | {name, valueFrom}].
env: []

# -- Extra envFrom sources (configMapRef/secretRef). The ExternalSecret's Secret (if
# externalSecrets.enabled) is appended automatically — no need to list it here.
envFrom: []

probes:
  liveness:
    enabled: false
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    enabled: false
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    enabled: false
    httpGet:
      path: /
      port: http
    failureThreshold: 30
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false

volumes: []
volumeMounts: []

# -- Pin to an architecture/node pool. This cluster mixes an x86 control-plane node
# and ARM64 (Raspberry Pi) workers — set this explicitly rather than relying on
# scheduler defaults if the image isn't multi-arch.
# Example: {"kubernetes.io/arch": "arm64"}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  # -- Port the Service listens on.
  port: 80
  # -- Port the container listens on (containerPort).
  targetPort: 8080
  annotations: {}

httpRoute:
  # -- Create an HTTPRoute (Gateway API) pointing at this app's Service.
  enabled: false
  gateway:
    # -- Name of the target Gateway (e.g. the NGINX Gateway Fabric Gateway).
    name: nginx-gateway
    # -- Namespace of the target Gateway.
    namespace: nginx-gateway
    # -- Optional: target a specific listener on the Gateway.
    sectionName: ""
  # -- Public hostnames this route answers for.
  hostnames: []
  backendRef:
    # -- Defaults to this app's own Service name when empty.
    name: ""
    # -- Defaults to service.port when empty.
    port: ""
  # -- One or more routing rules. Each rule has `matches` (path matches) and optional
  # `filters` (e.g. URLRewrite) and `timeouts` (request/backendRequest).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters: []
      timeouts: {}

configMap:
  # -- Create a ConfigMap with the data below.
  enabled: false
  # -- Name of the ConfigMap. Defaults to the fullname when empty.
  name: ""
  # -- Extra annotations to set on the ConfigMap.
  annotations: {}
  # -- Plain key/value pairs. Keys become env var names (with injectAsEnv) or file names (with mountPath).
  data: {}
  # -- Append this ConfigMap to the container's envFrom, exposing every key as an env var.
  injectAsEnv: false
  # -- If set, mount the ConfigMap at this path in the container (one file per key).
  # Leave empty to skip mounting; wire it manually via volumes/volumeMounts for partial mounts.
  mountPath: ""

ecrPullSecret:
  # -- Create an ExternalSecret that materializes a dockerconfigjson Secret from the
  # ECR token ClusterGenerator (managed in gitops.core-addons) and reference it
  # automatically in the pod's imagePullSecrets.
  enabled: false
  # -- Name of the ExternalSecret and generated Secret. Defaults to "<fullname>-ecr-pull".
  name: ""
  refreshInterval: 6h
  # -- Generator that yields the ECR credentials (proxy_endpoint/username/password).
  generatorRef:
    apiVersion: generators.external-secrets.io/v1alpha1
    kind: ClusterGenerator
    name: ecr-token

externalSecrets:
  # -- Create an ExternalSecret pulling from the shared ClusterSecretStore.
  enabled: false
  # -- Name of the existing SecretStore/ClusterSecretStore (e.g. "aws-ssm").
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  # -- Name of the generated Kubernetes Secret. Defaults to the fullname when empty.
  secretName: ""
  refreshInterval: 1h
  # -- Key mapping from the store to the generated Secret:
  # [{secretKey: <key in the k8s Secret>, remoteRef: {key: <SSM parameter path>, property: <optional, for JSON values>}}]
  data: []
